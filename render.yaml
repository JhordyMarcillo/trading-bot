services:
  - type: web
    name: binance-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor.py
    healthCheckPath: /health
    envVars:
      - key: DASHBOARD_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BINANCE_TESTNET_KEY
        sync: false
      - key: BINANCE_TESTNET_SECRET
        sync: false
